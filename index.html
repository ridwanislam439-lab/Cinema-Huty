<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Huty - Movie & FTP Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #090d16;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 1. SPLASH SCREEN / LOADER */
    #loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1320;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }

    .loader-box {
      text-align: center;
    }

    .loader-brand {
      color: #f4b400;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
    }

    .dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: #f4b400;
      opacity: 0.25;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* 2. TOP NAVBAR */
    header {
      background-color: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
    }
