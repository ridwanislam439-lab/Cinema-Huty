<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Huty</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0e17;
      color: #f3f4f6;
      padding-bottom: 56px;
    }

    .topbar {
      background: #121726;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f273d;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .menu-btn {
      font-size: 1.35rem;
      color: #e5e7eb;
      background: none;
      border: none;
      cursor: pointer;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.55);
    }

    .top-admin-btn {
      font-size: 0.78rem;
      font-weight: 700;
      color: #11131a;
      background: #f5c316;
      border: none;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      z-index: 40;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: -300px;
      width: 285px;
      max-width: 85vw;
      height: 100vh;
      background: #101522;
      border-right: 1px solid #1f2942;
      padding: 18px 16px;
      overflow-y: auto;
      transition: left 0.25s ease;
      z-index: 50;
    }

    .side-drawer.open {
      left: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1d263d;
    }

    .close-btn {
      background: #1a2236;
      color: #e5e7eb;
      border: 1px solid #2b3754;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .open-search-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #384975;
      background: linear-gradient(90deg, #17223b, #231d3d);
      color: #e5e7eb;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      margin-bottom: 16px;
      text-align: center;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-item {
      width: 100%;
      background: #171d2e;
      border: 1px solid #232d47;
      color: #e5e7eb;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .nav-item.admin-nav {
      border-color: rgba(245, 195, 22, 0.45);
      color: #f5c316;
    }

    .nav-item:hover,
    .nav-item.active {
      border-color: #4f67a8;
      background: #1d263d;
    }

    .search-wrap {
      padding: 14px 18px 8px;
    }

    .search-box {
      width: 100%;
      background: #151b2e;
      border: 1px solid #26314d;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 18px 4px;
      scrollbar-width: none;
    }

    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: #151b2e;
      color: #d1d5db;
      border: 1px solid #26314d;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-pill.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .player-banner {
      margin: 12px 18px 0;
      padding: 14px;
      background: #131a2e;
      border: 1px solid #2a3961;
      border-radius: 12px;
      display: none;
    }

    .player-banner.active {
      display: block;
    }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .player-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff;
    }

    .player-close {
      background: #1e2947;
      color: #e5e7eb;
      border: 1px solid #334575;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .player-url {
      font-size: 0.8rem;
      color: #93c5fd;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .player-link-btn {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* ইন-পেজ অ্যাডমিন প্যানেল সেকশন */
    .admin-panel-box {
      margin: 16px 18px 4px;
      padding: 16px;
      background: #12182b;
      border: 1px solid #2b385c;
      border-radius: 14px;
      display: none;
    }

    .admin-panel-box.open {
      display: block;
    }

    .admin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #212b47;
    }

    .admin-head h2 {
      font-size: 1.05rem;
      color: #f5c316;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .admin-input,
    .admin-select {
      width: 100%;
      background: #0d1220;
      border: 1px solid #273457;
      border-radius: 9px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-yellow {
      background: #f5c316;
      color: #11131a;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-green {
      background: #1db954;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-red {
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .admin-row {
      background: #182036;
      border: 1px solid #273457;
      border-radius: 8px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
    }

    .export-box {
      width: 100%;
      height: 110px;
      background: #0b0e17;
      color: #93c5fd;
      border: 1px solid #273457;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.76rem;
      margin-top: 10px;
      display: none;
    }

    .export-box.open {
      display: block;
    }

    .section {
      padding: 18px 0 6px 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-right: 18px;
    }

    .section-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: #ffffff;
    }

    .row-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-right: 18px;
      scrollbar-width: none;
    }

    .row-scroll::-webkit-scrollbar {
      display: none;
    }

    .movie-card {
      min-width: 155px;
      max-width: 155px;
      background: #131828;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #202942;
      flex-shrink: 0;
      cursor: pointer;
    }

    .movie-card:hover {
      border-color: #3b82f6;
    }

    .poster {
      position: relative;
      height: 215px;
      background: linear-gradient(135deg, #242b45, #141826);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      color: #ff6b81;
      font-weight: 700;
      background-size: cover;
      background-position: center;
    }

    .live-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #ef4444;
      color: #fff;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.5px;
    }

    .rank-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #f5b700;
      color: #111;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 3px 7px;
      border-radius: 5px;
    }

    .progress-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .movie-info {
      padding: 10px;
    }

    .movie-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #f9fafb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <div class="brand">CINEMA HUTY</div>
      <button class="close-btn" id="closeDrawerBtn" aria-label="Close Menu">✕</button>
    </div>

    <button class="open-search-btn" id="drawerSearchBtn">? OPEN SEARCH</button>

    <nav class="nav-list">
      <button class="nav-item active" data-category="ALL"><span>HOME</span></button>
      <button class="nav-item" data-category="LIVE TV"><span>LIVE TV</span><span>&gt;</span></button>
      <button class="nav-item" data-category="MOVIE"><span>MOVIE</span><span>&gt;</span></button>
      <button class="nav-item" data-category="TV SERIES"><span>TV SERIES</span><span>&gt;</span></button>
      <button class="nav-item" data-category="GAMES"><span>GAMES</span></button>
      <button class="nav-item" data-category="SOFTWARE"><span>SOFTWARE</span></button>
      <button class="nav-item" data-category="TUTORIAL"><span>TUTORIAL</span></button>
      <button class="nav-item admin-nav" id="drawerAdminBtn"><span>ADMIN PANEL</span><span>&gt;</span></button>
    </nav>
  </aside>

  <header class="topbar">
    <button class="menu-btn" id="openDrawerBtn" aria-label="Menu">☰</button>
    <div class="brand">CINEMA HUTY</div>
    <button class="top-admin-btn" id="topAdminBtn">Admin</button>
  </header>

  <div class="search-wrap">
    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="Search movie / live tv / series..."
    />
  </div>

  <div class="category-bar" id="categoryBar">
    <button class="cat-pill active" data-category="ALL">ALL</button>
    <button class="cat-pill" data-category="LIVE TV">LIVE TV</button>
    <button class="cat-pill" data-category="MOVIE">MOVIE</button>
    <button class="cat-pill" data-category="TV SERIES">TV SERIES</button>
    <button class="cat-pill" data-category="GAMES">GAMES</button>
    <button class="cat-pill" data-category="SOFTWARE">SOFTWARE</button>
    <button class="cat-pill" data-category="TUTORIAL">TUTORIAL</button>
  </div>

  <!-- Admin Panel সেকশন -->
  <div class="admin-panel-box" id="adminPanelBox">
    <div class="admin-head">
      <h2>🎮 Cinema Huty Admin Panel</h2>
      <button class="player-close" id="closeAdminBoxBtn">Close</button>
    </div>

    <!-- Login View -->
    <div id="adminLoginArea">
      <input
        type="password"
        id="adminPassInput"
        class="admin-input"
        placeholder="Enter Admin Password (Default: 1234)"
        style="margin-bottom: 10px;"
      />
      <button class="btn-yellow" id="adminLoginSubmit">Login to Admin</button>
    </div>
