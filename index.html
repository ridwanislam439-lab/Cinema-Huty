<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Huty - Movie & FTP Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #090d16;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ================= 1. SPLASH SCREEN / LOADER ================= */
    #loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1320;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }

    .loader-box {
      text-align: center;
    }

    .loader-brand {
      color: #f4b400;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
    }

    .dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: #f4b400;
      opacity: 0.25;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* ================= 2. TOP NAVBAR ================= */
    header {
      background-color: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .logo .part1 { color: #f59e0b; }
    .logo .part2 { color: #ffffff; }
    .logo .ext { font-size: 11px; color: #9ca3af; margin-left: 2px; }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    /* ================= 3. SIDEBAR MENU ================= */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      display: none;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100%;
      background-color: #0b111e;
      border-right: 1px solid #1e293b;
      z-index: 2001;
      padding: 20px 16px;
      transition: left 0.3s ease;
      overflow-y: auto;
    }

    .sidebar.active { left: 0; }
    .sidebar-overlay.active { display: block; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .sidebar-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
    }
