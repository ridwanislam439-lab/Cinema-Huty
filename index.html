<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cineplex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b1320;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1320;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .loader-box {
      text-align: center;
    }

    .brand {
      color: #f4b400;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #f4b400;
      opacity: 0.25;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.9);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="loader-box">
      <div class="brand">CINEPLEX</div>
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <!-- আপনার মূল পেজের কনটেন্ট এখানে থাকবে -->
  <div id="app">
    <h1>Welcome to Cineplex</h1>
  </div>

  <script>
    window.addEventListener("load", function () {
      const loader = document.getElementById("loader");
      loader.style.opacity = "0";
      setTimeout(() => {
        loader.style.display = "none";
      }, 400);
    });
  </script>

</body>
</html>
