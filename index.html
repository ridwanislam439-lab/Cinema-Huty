<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Huty</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0d10;
      color: #ffffff;
      padding-bottom: 75px;
    }

    #loader {
      position: fixed;
      inset: 0;
      background-color: #0b1320;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }

    .loader-brand {
      color: #f4b400;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-transform: uppercase;
      text-align: center;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #f4b400;
      opacity: 0.25;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0b0d10;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #181b22;
    }

    .brand-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #22c55e;
      color: #000;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-pill {
      flex: 1;
      background: #262930;
      border-radius: 20px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-pill input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .main-tabs {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .live-pill {
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
    }

    .m-tab {
      color: #9ca3af;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .m-tab.active {
      color: #ffffff;
      font-weight: 800;
    }

    .section-block {
      margin-bottom: 22px;
    }

    .sec-header {
      padding: 0 14px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sec-header h3 {
      font-size: 17px;
      font-weight: 800;
    }

    .poster-row {
      display: flex;
      gap: 10px;
      padding: 0 14px;
      overflow-x: auto;
    }

    .movie-card {
      min-width: 122px;
      max-width: 122px;
      text-decoration: none;
      color: inherit;
    }

    .poster-box {
      width: 122px;
      height: 168px;
      border-radius: 8px;
      background: #1a1e26;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid #252a34;
    }

    .rank-badge {
      position: absolute;
      top: 0;
      left: 0;
      background: #facc15;
      color: #000;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-bottom-right-radius: 8px;
    }

    .lang-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .movie-name {
      font-size: 12px;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #12151a;
      border-top: 1px solid #1f232b;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 10px;
      z-index: 1000;
    }

    .b-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .b-item.active {
      color: #22c55e;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div>
      <div class="loader-brand">CINEMA HUTY</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <header class="top-bar">
    <div class="brand-avatar">CH</div>
    <div class="search-pill">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search Movie, Series, Live TV..." onkeyup="renderAll()" />
    </div>
  </header>

  <nav class="main-tabs">
    <span class="live-pill" onclick="switchTab('LIVE', this)">● LIVE TV</span>
    <span class="m-tab active" onclick="switchTab('ALL', this)">Trending</span>
    <span class="m-tab" onclick="switchTab('MOVIE', this)">Movies</span>
    <span class="m-tab" onclick="switchTab('SERIES', this)">TV Series</span>
  </nav>

  <main id="appContainer">
    <section class="section-block" id="liveSection">
      <div class="sec-header"><h3>Live TV Channels</h3></div>
      <div class="poster-row" id="liveList"></div>
    </section>

    <section class="section-block" id="movieSection">
      <div class="sec-header"><h3>Movies</h3></div>
      <div class="poster-row" id="movieList"></div>
    </section>

    <section class="section-block" id="seriesSection">
      <div class="sec-header"><h3>TV Series</h3></div>
      <div class="poster-row" id="seriesList"></div>
    </section>
  </main>

  <footer class="bottom-nav">
    <div class="b-item active" onclick="switchTab('ALL', this)"><span>🏠</span><span>Home</span></div>
    <div class="b-item" onclick="switchTab('LIVE', this)"><span>📺</span><span>Live TV</span></div>
    <div class="b-item" onclick="switchTab('MOVIE', this)"><span>🎬</span><span>Movies</span></div>
    <div class="b-item" onclick="switchTab('SERIES', this)"><span>🎞️</span><span>Series</span></div>
  </footer>

  <script>
    const SERVER_DATA = [
      {
        type: "LIVE",
        title: "T Sports HD",
        tag: "LIVE",
        poster: "",
        url: "#tsports-stream-link"
      },
      {
        type: "LIVE",
        title: "Sony Ten 1",
        tag: "LIVE",
        poster: "",
        url: "#sony1-stream-link"
      },
      {
        type: "MOVIE",
        title: "Rockstar (2011)",
        tag: "Hindi",
        poster: "https://upload.wikimedia.org/wikipedia/en/6/68/Rockstar-Movie-Poster.jpg",
        url: "#rockstar-download-or-watch-link"
      },
      {
  type: "MOVIE",
  title: "Demonte Colony 3 (2026)",
  tag: "Horror",
  poster: "", // https://en.wikipedia.org/wiki/File:Demonte_Colony_3.jpg
  url: "#demonte-colony-3-link" // http://vod.cineplexbd.net:8081/movies/Hindi%20Dubbed/Tamil%20Movies/2026/Demonte%20Colony%203%20%282026%29%201080p/Demonte%20Colony%203%20%282026%29%201080p.mp4/index.m3u8
},
{
        type: "MOVIE",
        title: "Bangla Movie 2026",
        tag: "Bangla",
        poster: "",
        url: "#bangla-movie-link"
      },
      {
        type: "MOVIE",
        title: "Action Blockbuster",
        tag: "Hindi",
        poster: "",
        url: "#hindi-movie-link"
      },
      {
        type: "SERIES",
        title: "Nine to Six (S01)",
        tag: "Series",
        poster: "",
        url: "#series-link"
      },
      {
        type: "SERIES",
        title: "Naruto Shippuden",
        tag: "Anime",
        poster: "",
        url: "#anime-link"
      }
    ];

    window.addEventListener("load", function () {
      const loader = document.getElementById("loader");
      setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => loader.style.display = "none", 400);
      }, 400);
      renderAll();
    });

    function switchTab(type, el) {
      document.querySelectorAll(".m-tab, .b-item").forEach(item => item.classList.remove("active"));
      if (el) el.classList.add("active");

      document.getElementById("liveSection").style.display = (type === "ALL" || type === "LIVE") ? "block" : "none";
      document.getElementById("movieSection").style.display = (type === "ALL" || type === "MOVIE") ? "block" : "none";
      document.getElementById("seriesSection").style.display = (type === "ALL" || type === "SERIES") ? "block" : "none";
    }

    function createCard(item, index) {
      const bgStyle = item.poster ? `style="background-image: url('${item.poster}')"` : "";
      return `
        <a class="movie-card" href="${item.url}" target="_blank">
          <div class="poster-box" ${bgStyle}>
            <span class="rank-badge">${index + 1}</span>
            <span class="lang-tag">${item.tag}</span>
          </div>
          <div class="movie-name">${item.title}</div>
        </a>
      `;
    }

    function renderAll() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = SERVER_DATA.filter(item => item.title.toLowerCase().includes(q) || item.tag.toLowerCase().includes(q));

      const lives = filtered.filter(i => i.type === "LIVE");
      const movies = filtered.filter(i => i.type === "MOVIE");
      const series = filtered.filter(i => i.type === "SERIES");

      document.getElementById("liveList").innerHTML = lives.map((item, i) => createCard(item, i)).join("") || "<p style='padding:0 14px;color:#9ca3af;font-size:13px;'>No Live TV added</p>";
      document.getElementById("movieList").innerHTML = movies.map((item, i) => createCard(item, i)).join("") || "<p style='padding:0 14px;color:#9ca3af;font-size:13px;'>No Movies added</p>";
      document.getElementById("seriesList").innerHTML = series.map((item, i) => createCard(item, i)).join("") || "<p style='padding:0 14px;color:#9ca3af;font-size:13px;'>No Series added</p>";
    }
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Huty - Movie Admin Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d101b;
      color: #f3f4f6;
      padding: 18px 16px 60px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* লগইন স্ক্রিন */
    .login-box {
      background: #141929;
      border: 1px solid #242d47;
      border-radius: 14px;
      padding: 26px 20px;
      margin-top: 60px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 14px;
      font-size: 1.35rem;
    }

    .login-input {
      width: 100%;
      background: #1c2236;
      border: 1px solid #2f3b5c;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    /* হেডার */
    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
    }

    /* অ্যাকশন বাটন গ্রিড (স্ক্রিনশটের মতো) */
    .btn-row-top {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-row-right {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .btn-yellow {
      background: #f5c316;
      color: #11131a;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .btn-yellow:hover {
      filter: brightness(1.06);
    }

    .btn-yellow:active {
      transform: scale(0.98);
    }

    .btn-w-medium {
      min-width: 185px;
    }

    .btn-w-wide {
      min-width: 230px;
    }

    .btn-row-logs {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      margin: 14px 0 22px;
    }

    .btn-purple {
      background: #8a3ffc;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout {
      background: transparent;
      border: none;
      color: #d1d5db;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* সার্চ এবং ড্রপডাউন ফিল্টার */
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dark-input,
    .dark-select {
      width: 100%;
      background: #1d2230;
      border: 1px solid #2b3347;
      border-radius: 10px;
      padding: 13px 14px;
      color: #e5e7eb;
      font-size: 0.95rem;
      outline: none;
    }

    .dark-input::placeholder {
      color: #9ca3af;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .btn-green {
      background: #1db954;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* মুভি কার্ড লিস্ট */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .admin-card {
      background: #151a28;
      border: 1px solid #242d45;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .admin-poster {
      height: 210px;
      background: linear-gradient(135deg, #273252, #161b2c);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      font-weight: 800;
      color: #f5c316;
      position: relative;
    }

    .cat-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(13, 16, 27, 0.88);
      color: #f5c316;
      border: 1px solid #384466;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .admin-card-body {
      padding: 10px;
    }

    .admin-card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-card-meta {
      font-size: 0.76rem;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .card-btns {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: none;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-edit {
      background: #2563eb;
      color: #fff;
    }

    .btn-del {
      background: #dc2626;
      color: #fff;
    }

    /* মডাল পপআপ */
    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 60;

    .modal-backdrop.open {

    .modal-box {
      background: #151a29;

      display: flex;
      align-items: center;

      border: 1px solid #293352;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.78rem;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <!-- লগইন সেকশন -->

  <!-- মূল অ্যাডমিন প্যানেল -->

      <button class="btn-yellow" id="viewAllBtn">View World All Movie</button>

    <div class="btn-row-right">

        <button class="close-modal" id="closeModalBtn">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>

    const LOGS_KEY = "cinema_huty_admin_logs";

    const defaultItems = [
      {
        id: 1,

        actor: "Snoopy, Charlie Brown",
        category: "MOVIE",
        year: "2026",
        poster: "",
        stream: "https://example.com/movies/home-snoopy"
      },
      {
        id: 2,
        title: "Operation Shadow",
        actor: "Action Cast",
        category: "MOVIE",
        year: "2026",
        poster: "",
        stream: "https://example.com/movies/operation-shadow"
      },
      {
        id: 3,
        title: "Midnight Echo",
        actor: "Drama Cast",
        category: "TV SERIES",
        year: "2025",
        poster: "",
        stream: "https://example.com/series/midnight-echo"
      },
      {
        id: 4,
        title: "World News HD",
        actor: "Live Broadcast",
        category: "LIVE TV",
        year: "24/7",
        poster: "",
        stream: "https://example.com/live/world-news.m3u8"
      }
    ];

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultItems;
    let logs = JSON.parse(localStorage.getItem(LOGS_KEY)) || [
      { text: "Admin panel initialized", time: new Date().toLocaleString() }
    ];

    const loginView = document.getElementById("loginView");
    const adminView = document.getElementById("adminView");
    const adminPassInput = document.getElementById("adminPassInput");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const limitSelect = document.getElementById("limitSelect");
    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");
    const movieGrid = document.getElementById("movieGrid");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const closeModalBtn = document.getElementById("closeModalBtn");

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.setItem(LOGS_KEY, JSON.stringify(logs));
    }

    function addLog(text) {
      logs.unshift({ text, time: new Date().toLocaleString() });
      if (logs.length > 40) logs.pop();
      saveState();
    }

    function checkAuth() {
      if (sessionStorage.getItem("cinema_huty_logged") === "1") {
        loginView.classList.add("hidden");
        adminView.classList.remove("hidden");
        renderMovies();
      } else {
        loginView.classList.remove("hidden");
        adminView.classList.add("hidden");
      }
    }

    loginBtn.addEventListener("click", () => {
      if (adminPassInput.value === ADMIN_PASS) {
        sessionStorage.setItem("cinema_huty_logged", "1");
        addLog("Admin logged in");
        checkAuth();
      } else {
        alert("Wrong password! Default is 1234");
      }
    });

    logoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("cinema_huty_logged");
      addLog("Admin logged out");
      checkAuth();
    });

    function openModal(title, html) {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalBackdrop.classList.add("open");
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    function renderMovies() {
      const q = searchInput.value.toLowerCase().trim();
      const cat = categorySelect.value;
      const limit = parseInt(limitSelect.value, 10) || 15;

      const filtered = items.filter((item) => {
        const matchText =
          item.title.toLowerCase().includes(q) ||
          (item.actor && item.actor.toLowerCase().includes(q));
        const matchCat = cat === "ALL" || item.category === cat;
        return matchText && matchCat;
      }).slice(0, limit);

      movieGrid.innerHTML = "";
      if (!filtered.length) {
        movieGrid.innerHTML = `<p style="grid-column: 1/-1; color:#9ca3af; text-align:center; padding:20px;">No items found.</p>`;
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement("div");
        card.className = "admin-card";
        const bgStyle = item.poster ? `background-image: url('${item.poster.replace(/'/g, "\\'")}');` : "";
        card.innerHTML = `
          <div class="admin-poster" style="${bgStyle}">
            <span class="cat-tag">${item.category}</span>
            ${item.poster ? "" : `<span>${item.title}</span>`}
          </div>
          <div class="admin-card-body">
            <div class="admin-card-title">${item.title}</div>
            <div class="admin-card-meta">${item.year || "2026"} • ${item.actor || "N/A"}</div>
            <div class="card-btns">
              <button class="btn-mini btn-edit" data-id="${item.id}">Edit</button>
              <button class="btn-mini btn-del" data-id="${item.id}">Delete</button>
            </div>
          </div>
        `;
        movieGrid.appendChild(card);
      });

      document.querySelectorAll(".btn-del").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.getAttribute("data-id"));
          const target = items.find((x) => x.id === id);
          items = items.filter((x) => x.id !== id);
          addLog(`Deleted: ${target ? target.title : id}`);
          renderMovies();
        });
      });

      document.querySelectorAll(".btn-edit").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.getAttribute("data-id"));
          const target = items.find((x) => x.id === id);
          if (target) showItemForm(target);
        });
      });
    }

    function showItemForm(editItem = null) {
      openModal(editItem ? "Edit Content" : "➕ Add New Movie / Content", `
        <div class="form-stack">
          <input type="text" id="fTitle" class="dark-input" placeholder="Title (e.g. Home, Snoopy)" value="${editItem ? editItem.title : ""}" />
          <input type="text" id="fActor" class="dark-input" placeholder="Actor / Cast / Info" value="${editItem ? editItem.actor : ""}" />
          <select id="fCategory" class="dark-select">
            <option value="MOVIE" ${editItem && editItem.category === "MOVIE" ? "selected" : ""}>MOVIE</option>
            <option value="TV SERIES" ${editItem && editItem.category === "TV SERIES" ? "selected" : ""}>TV SERIES</option>
            <option value="LIVE TV" ${editItem && editItem.category === "LIVE TV" ? "selected" : ""}>LIVE TV</option>
            <option value="GAMES" ${editItem && editItem.category === "GAMES" ? "selected" : ""}>GAMES</option>
            <option value="SOFTWARE" ${editItem && editItem.category === "SOFTWARE" ? "selected" : ""}>SOFTWARE</option>
            <option value="TUTORIAL" ${editItem && editItem.category === "TUTORIAL" ? "selected" : ""}>TUTORIAL</option>
          </select>
          <input type="text" id="fYear" class="dark-input" placeholder="Year / Quality (e.g. 2026 or HD)" value="${editItem ? editItem.year : "2026"}" />
          <input type="url" id="fPoster" class="dark-input" placeholder="Poster Image URL (https://...)" value="${editItem ? editItem.poster : ""}" />
          <input type="url" id="fStream" class="dark-input" placeholder="Watch / Download / Stream URL (https://...)" value="${editItem ? editItem.stream : ""}" />
          <button class="btn-green" id="saveItemBtn" style="justify-content:center;">Save Content</button>
        </div>
      `);

      document.getElementById("saveItemBtn").addEventListener("click", () => {
        const title = document.getElementById("fTitle").value.trim();
        if (!title) {
          alert("Title is required!");
          return;
        }
        const entry = {
          id: editItem ? editItem.id : Date.now(),
          title,
          actor: document.getElementById("fActor").value.trim(),
          category: document.getElementById("fCategory").value,
          year: document.getElementById("fYear").value.trim() || "2026",
          poster: document.getElementById("fPoster").value.trim(),
          stream: document.getElementById("fStream").value.trim()
        };

        if (editItem) {
          items = items.map((x) => (x.id === editItem.id ? entry : x));
          addLog(`Updated: ${entry.title}`);
        } else {
          items.unshift(entry);
          addLog(`Added new (${entry.category}): ${entry.title}`);
        }
        saveState();
        renderMovies();
        closeModal();
      });
    }

    document.getElementById("addMovieBtn").addEventListener("click", () => showItemForm());

    document.getElementById("scanMovieBtn").addEventListener("click", () => {
      openModal("➕ Scan / Bulk Import Links", `
        <p style="font-size:0.84rem; color:#d1d5db; margin-bottom:8px;">
          প্রতি লাইনে <b>Title | Category | StreamURL</b> ফরম্যাটে লিংক পেস্ট করে একসাথে স্ক্যান/যোগ করুন:
        </p>
        <textarea id="bulkInput" class="export-area" placeholder="Movie Name | MOVIE | https://example.com/movie.mp4&#10;News Live | LIVE TV | https://example.com/live.m3u8"></textarea>
        <button class="btn-yellow" id="runScanBtn" style="width:100%;">Scan & Import Now</button>
      `);

      document.getElementById("runScanBtn").addEventListener("click", () => {
        const raw = document.getElementById("bulkInput").value.trim();
        if (!raw) return;
        const lines = raw.split(/\r?\n/);
        let count = 0;
        lines.forEach((line) => {
          const parts = line.split("|").map((s) => s.trim());
          if (parts[0]) {
            items.unshift({
              id: Date.now() + Math.random(),
              title: parts[0],
              category: parts[1] || "MOVIE",
              stream: parts[2] || "",
              actor: "Scanned",
              year: "2026",
              poster: ""
            });
            count++;
          }
        });
        addLog(`Scanned & imported ${count} items`);
        renderMovies();
        closeModal();
      });
    });

    document.getElementById("viewAllBtn").addEventListener("click", () => {
      const jsonCode = JSON.stringify(items, null, 2);
      openModal("View World All Movie & Export", `
        <p style="font-size:0.84rem; color:#d1d5db;">
          মোট সংরক্ষিত আইটেম: <b>${items.length}</b>টি। নিচের ডাটা কপি করে আপনি আপনার মূল <code>index.html</code> ফাইলে বসাতে পারবেন:
        </p>
        <textarea class="export-area" readonly>${jsonCode}</textarea>
        <button class="btn-green" id="copyJsonBtn" style="width:100%; justify-content:center;">Copy All Data</button>
      `);
      document.getElementById("copyJsonBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(jsonCode);
        alert("Copied to clipboard!");
      });
    });

    document.getElementById("viewRequestBtn").addEventListener("click", () => {
      openModal("View Request", `
        <div class="log-item">
          <b>Sample Request:</b> Pushpa 2 (Hindi Dubbed)<br/>
          <span style="color:#9ca3af;">Category: MOVIE • Status: Pending</span>
        </div>
        <p style="font-size:0.8rem; color:#9ca3af; margin-top:8px;">
          নোট: GitHub Pages স্ট্যাটিক হোস্টিং হওয়ায় লাইভ ইউজার রিকোয়েস্ট জমা রাখতে চাইলে Google Form বা Firebase যুক্ত করা যায়।
        </p>
      `);
    });

    document.getElementById("logsBtn").addEventListener("click", () => {
      const logHtml = logs.map((l) => `
        <div class="log-item">
          <div>${l.text}</div>
          <div class="log-time">${l.time}</div>
        </div>
      `).join("");
      openModal("📜 Activity Logs", logHtml || "<p>No logs yet.</p>");
    });

    searchBtn.addEventListener("click", renderMovies);
    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      categorySelect.value = "ALL";
      limitSelect.value = "15";
      renderMovies();
    });

    checkAuth();
  </script>
</body>
</html>
