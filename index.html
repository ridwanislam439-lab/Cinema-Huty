<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Huty</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0e17;
      color: #f3f4f6;
      padding-bottom: 48px;
    }

    .topbar {
      background: #121726;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f273d;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .menu-btn {
      font-size: 1.3rem;
      color: #e5e7eb;
      background: none;
      border: none;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.55);
    }

    .search-wrap {
      padding: 14px 18px 6px;
    }

    .search-box {
      width: 100%;
      background: #151b2e;
      border: 1px solid #26314d;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .section {
      padding: 18px 0 6px 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-right: 18px;
    }

    .section-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: #ffffff;
    }
